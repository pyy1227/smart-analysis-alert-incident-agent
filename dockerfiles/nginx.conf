server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker service IPs can change after a container is recreated. Resolve the
    # service name continuously instead of caching its startup-time address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $incident_api incident-api:8000;
        proxy_pass http://$incident_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 对话需要立即转发每个模型分片，不能让 Nginx 缓冲完整响应。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
