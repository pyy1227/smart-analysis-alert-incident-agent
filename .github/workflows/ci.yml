name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.14 tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Install locked Python dependencies
        run: uv sync --frozen

      - name: Run Python test suite
        run: |
          uv run --no-sync python -m unittest discover -s tests -v
          uv run --no-sync python -m unittest discover -s payment_api/tests -v

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.compose.example config --quiet

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
