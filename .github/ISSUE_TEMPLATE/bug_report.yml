name: Bug 报告
description: 报告一个可复现的缺陷（安全问题请勿使用本模板）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认这是**本地演示环境**中的缺陷，且不包含任何真实密钥、令牌或个人数据。
        安全漏洞请按 [SECURITY.md](../blob/main/SECURITY.md) 中的方式私下报告。

  - type: textarea
    id: what-happened
    attributes:
      label: 实际现象
      description: 发生了什么？和预期有什么差别？
      placeholder: 例如：告警接入后事件一直停在 analysis_requested，Worker 日志报 ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给出可复现的最小步骤和命令。
      placeholder: |
        1. docker compose --env-file .env.compose up -d
        2. curl -X POST http://localhost:8100/webhook/prometheus -d @sample.json
        3. 观察 worker 日志 ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 受影响组件
      multiple: true
      options:
        - ingest / 告警接入
        - worker / LangGraph 工作流
        - incident-api
        - mcp-ops-server
        - payment-api
        - web 前端
        - compose / 基础设施
        - 文档
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、Python / Node / Docker 版本，以及相关服务是否通过 Compose 启动。
      value: |
        - OS:
        - Python (`uv run python --version`):
        - Node (`node --version`):
        - Docker (`docker --version` / `docker compose version`):
        - 启动方式（Compose / 本地直连）:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志与报错
      description: 请先脱敏，再粘贴相关日志或 traceback。
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认日志中不包含真实密钥、令牌、客户数据或内部地址
          required: true
        - label: 我已搜索过现有 Issue，没有重复
          required: true
